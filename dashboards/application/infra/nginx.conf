events { worker_connections 512; }
http {
  server_tokens off;
  access_log off;
  error_log /dev/stderr warn;
  client_max_body_size 1m;
  server {
    listen 443 ssl;
    server_name localhost proxy;
    ssl_certificate /etc/nginx/identity/cert.pem;
    ssl_certificate_key /etc/nginx/identity/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;
    proxy_set_header Host localhost:8443;
    proxy_set_header X-Forwarded-Host localhost:8443;
    proxy_set_header X-Forwarded-Port 8443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Admin console must use an operator-only container tunnel, never this public route.
    location /auth/admin/ { return 403; }
    location /auth/realms/skelivia/ { proxy_pass http://keycloak:8080; }
    location /auth/resources/ { proxy_pass http://keycloak:8080; }
    location /auth/ { return 403; }
    # Only the authenticated simulator launcher may be framed by this origin.
    # Declaring location headers replaces server inheritance: repeat the common
    # protections and hide the upstream XFO before setting one coherent value.
    location = /static/simulation.html {
      proxy_pass http://app:8000;
      proxy_hide_header X-Frame-Options;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Cache-Control "no-store" always;
    }
    location = /simulateur {
      absolute_redirect off;
      return 308 /simulateur/$is_args$args;
    }
    location /simulateur/ {
      # The optional simulator can be absent at proxy startup without breaking
      # the main application; Docker resolves it when this route is requested.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $simulator_backend simulator:8774;
      proxy_set_header X-Forwarded-Prefix /simulateur;
      # proxy_set_header inheritance is all-or-nothing in nginx: keep the
      # public origin headers when adding the simulator prefix at this level.
      proxy_set_header Host localhost:8443;
      proxy_set_header X-Forwarded-Host localhost:8443;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      rewrite ^/simulateur/(.*)$ /$1 break;
      proxy_pass http://$simulator_backend;
    }
    location / { proxy_pass http://app:8000; }
  }
}
